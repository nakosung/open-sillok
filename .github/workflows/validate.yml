name: Validate contributions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  content:
    name: Content integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, verified 2026-09-12
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Read proposed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: proposed
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate PR with the base checker
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 trusted/scripts/check-pr.py --base trusted --head proposed --pull-request
      - name: Validate merged content
        if: github.event_name == 'push'
        run: python3 trusted/scripts/check-pr.py --base trusted --head proposed
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Compile and check
        run: |
          python3 scripts/compile-edition.py
          python3 -m unittest discover -s tests
          python3 scripts/verify-edition.py
          node scripts/verify-reading.mjs
          pnpm exec tsc --noEmit
      - name: Build portable site
        env:
          OPEN_SILLOK_HOST: cloudflare
        run: pnpm build
