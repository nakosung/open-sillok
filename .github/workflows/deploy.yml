name: Deploy public edition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-edition
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy Cloudflare
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install and validate
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          python3 scripts/check-content.py
          python3 scripts/compile-edition.py
          python3 -m unittest discover -s tests
          python3 scripts/verify-edition.py
          node scripts/verify-reading.mjs
          pnpm exec tsc --noEmit
      - name: Build and package source download
        env:
          OPEN_SILLOK_HOST: cloudflare
        run: |
          python3 scripts/package-source.py
          pnpm build
      - name: Publish checked build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
